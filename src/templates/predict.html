{% extends "base.html" %}
{% block title %}GradeMind - Predict Performance{% endblock %}

{% block content %}
<section class="page-header">
    <h1>📝 Student Performance Prediction</h1>
    <p>Enter the student's academic information to predict their performance category.</p>
</section>

<div class="form-container" id="prediction-form-container">
    <form method="POST" action="{{ url_for('predict') }}" class="prediction-form" id="prediction-form">
        
        <div class="form-group">
            <label for="student_id">Student ID</label>
            <input type="text" id="student_id" name="student_id" required placeholder="e.g. STU001">
        </div>

        <div class="form-group">
            <label for="student_name">Student Name</label>
            <input type="text" id="student_name" name="student_name" required placeholder="e.g. Rahul">
        </div>

        <div class="form-group">
            <label for="attendance_pct">Attendance Percentage (0–100)</label>
            <input type="number" id="attendance_pct" name="attendance_pct" 
                   min="0" max="100" step="0.1" required
                   placeholder="e.g. 92.0">
        </div>

        <div class="form-group">
            <label for="internal_marks">Internal Marks (0–100)</label>
            <input type="number" id="internal_marks" name="internal_marks" 
                   min="0" max="100" step="1" required
                   placeholder="e.g. 87">
        </div>

        <div class="form-group">
            <label for="assignment_score">Assignment Score (0–100)</label>
            <input type="number" id="assignment_score" name="assignment_score" 
                   min="0" max="100" step="1" required
                   placeholder="e.g. 90">
        </div>

        <div class="form-group">
            <label for="study_hours_per_week">Study Hours Per Week (0–50)</label>
            <input type="number" id="study_hours_per_week" name="study_hours_per_week" 
                   min="0" max="50" step="0.1" required
                   placeholder="e.g. 15.0">
        </div>

        <div class="form-group">
            <label for="previous_gpa">Previous GPA (0–10)</label>
            <input type="number" id="previous_gpa" name="previous_gpa" 
                   min="0" max="10" step="0.1" required
                   placeholder="e.g. 8.7">
        </div>

        <div class="form-actions">
            <button type="submit" class="btn btn-primary" id="btn-predict-submit">
                🔮 Predict Performance
            </button>
            <button type="reset" class="btn btn-secondary" id="btn-reset">
                Clear Form
            </button>
        </div>
    </form>
</div>
{% endblock %}
